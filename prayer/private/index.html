<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>内部代祷区 · 西区周二祷告聚会</title><style>body{background:#f7f5f0;color:#243b43;font:17px/1.7 system-ui;margin:0;padding:24px}.panel{max-width:680px;margin:6vh auto;background:white;padding:28px;border:1px solid #ddd;border-radius:14px}input,button{font:inherit;padding:10px;border:1px solid #bbb;border-radius:8px}input{width:min(95%,390px)}button{background:#17617d;color:white;cursor:pointer;margin:6px 5px 6px 0}button:disabled{opacity:.6}.muted{color:#65747b}.item{border-bottom:1px solid #eee;padding:12px 0}pre{white-space:pre-wrap;word-break:break-word}a{color:#17617d}</style></head><body><main class="panel"><h1>内部代祷区 / Private Prayer Area</h1><p class="muted">仅限经过邮箱验证及管理员批准的圣徒。Access requires verified email and administrator approval.</p><section id="login"><label for="email">电子邮箱 / Email</label><p><input id="email" type="email" autocomplete="email" placeholder="name@example.com"></p><button id="send">发送验证码 / Send verification code</button><p class="muted">请查看邮件中的六位数字验证码，在下方输入。首次登录后须等待管理员批准。</p><div id="otp-area" hidden><label for="otp">六位验证码 / 6-digit code</label><p><input id="otp" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000"></p><button id="verify">验证并登录 / Verify and sign in</button></div></section><section id="account" hidden><p id="identity"></p><button id="logout">退出登录 / Sign out</button><p id="status"></p><section id="admin" hidden><h2>待审核圣徒 / Members</h2><div id="members"></div></section><section id="requests" hidden><h2>私密代祷 / Private requests</h2><div id="prayers"></div></section></section><p id="message" role="status"></p><p><a href="../">← 返回公开祷告页面</a></p></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://kyuoqfzyffiojryeztsl.supabase.co','sb_publishable_qSo3U6VnlpKZwyE0yzkTCA_NIk_jrS9');
const $=id=>document.getElementById(id), msg=t=>$('message').textContent=t;
$('send').onclick=async()=>{const email=$('email').value.trim();if(!email){msg('请填写邮箱');return;} $('send').disabled=true;const {error}=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});$('send').disabled=false;if(!error){$('otp-area').hidden=false;sessionStorage.setItem('prayer_otp_email',email);}msg(error?'发送失败：'+error.message:'验证码邮件已发送，请检查邮箱。');};
$('verify').onclick=async()=>{const email=$('email').value.trim()||sessionStorage.getItem('prayer_otp_email')||'';const token=$('otp').value.trim();if(!email||!/^[0-9]{6}$/.test(token)){msg('请填写邮箱和六位数字验证码。');return;}$('verify').disabled=true;const {error}=await db.auth.verifyOtp({email,token,type:'email'});$('verify').disabled=false;if(error){msg('验证码无效或已过期：'+error.message);return;}sessionStorage.removeItem('prayer_otp_email');msg('验证成功，正在加载账户。');await load();};
$('logout').onclick=async()=>{await db.auth.signOut();location.reload();};
async function load(){const {data:{user}}=await db.auth.getUser();$('login').hidden=!!user;$('account').hidden=!user;if(!user)return;$('identity').textContent=user.email||'';const {data:m,error:e}=await db.from('prayer_members').select('role,approved').eq('user_id',user.id).maybeSingle();if(e){$('status').textContent='无法确认权限：'+e.message;return;}if(!m||!m.approved){$('status').textContent='已登录，正在等待管理员审核。';return;}$('status').textContent='身份验证和访问权限已通过。';$('requests').hidden=false;const {data:p,error:pe}=await db.from('private_prayer_requests').select('title,body,created_at').order('created_at',{ascending:false});if(pe){msg('资料读取失败：'+pe.message);}else{const root=$('prayers');root.replaceChildren();if(!p.length)root.textContent='暂无私密代祷内容。';for(const q of p){const d=document.createElement('div');d.className='item';const h=document.createElement('strong');h.textContent=q.title;const b=document.createElement('pre');b.textContent=q.body;d.append(h,b);root.append(d);}}if(m.role==='admin'){$('admin').hidden=false;await members();}}
async function members(){const {data,error}=await db.from('prayer_members').select('user_id,email,approved,role').order('created_at',{ascending:false});if(error){msg(error.message);return;}const root=$('members');root.replaceChildren();for(const m of data){const d=document.createElement('div');d.className='item';const t=document.createElement('span');t.textContent=m.email+' — '+(m.approved?'已批准':'待审核')+' ('+m.role+')';d.append(t);if(m.role!=='admin'){const b=document.createElement('button');b.textContent=m.approved?'撤销访问':'批准访问';b.onclick=async()=>{b.disabled=true;const {error}=await db.from('prayer_members').update({approved:!m.approved}).eq('user_id',m.user_id);if(error){msg('操作失败：'+error.message);b.disabled=false;}else await members();};d.append(b);}root.append(d);}}
const previousEmail=sessionStorage.getItem('prayer_otp_email');if(previousEmail){$('email').value=previousEmail;$('otp-area').hidden=false;}db.auth.onAuthStateChange(()=>{setTimeout(load,0)});load();
</script></body></html>
